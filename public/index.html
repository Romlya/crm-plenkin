<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="description" content="ПЛЕНКИН CRM — лиды, заказы, оплаты и прибыль" />
  <title>ПЛЕНКИН · CRM</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo">ПЛЕНКИН</div>
    <div class="boot-sub">АРХИТЕКТУРНЫЕ ПЛЁНКИ · CRM</div>
    <div class="boot-line"><span></span></div>
  </div>

  <div id="auth" class="auth hidden"></div>

  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="view" tabindex="-1"></main>
      <nav class="mobile-nav" id="mobileNav"></nav>
    </div>
  </div>

  <div id="overlay" class="overlay-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
